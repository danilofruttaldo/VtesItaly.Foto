name: CI

# ci -> deploy to GitHub Pages (foto.vtesitaly.com, see public/CNAME).
# The Pages deploy needs no secret: the job's OIDC token is enough. The
# optional SITE_DISPATCH_TOKEN then asks vtesitaly.com to rebuild.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pages rejects a deploy while another is running: a newer push waits for
  # the running one instead of cancelling it halfway through deploy-pages.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      albums-changed: ${{ steps.albums.outputs.changed }}
      albums-sha: ${{ steps.albums.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # The runner may cache an older 24.x; Astro wants a recent one (engines).
          check-latest: true
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # prebuild (scripts/build-photos.mjs) also checks every photo against
      # scripts/photo-rules.mjs and stops on one that breaks them.
      - run: npm run build
      - run: npm run check

      - name: Enforce the Pages size budget
        # GitHub Pages publishes at most 1 GB: warn early, stop before it.
        run: |
          SIZE_MB=$(du --apparent-size -sm dist | cut -f1)
          echo "dist: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 900 ]; then
            echo "::error::dist is ${SIZE_MB}MB, near the 1 GB GitHub Pages limit."
            exit 1
          elif [ "$SIZE_MB" -gt 750 ]; then
            echo "::warning::dist is ${SIZE_MB}MB: plan the next step before the 1 GB GitHub Pages limit."
          fi

      - name: Compare /albums.json with the live one
        # Only a change there is worth a vtesitaly.com rebuild: commits that
        # touch CI, dependencies or page code leave it as it is.
        id: albums
        run: |
          echo "sha=$(sha256sum dist/albums.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          if curl -fsS https://foto.vtesitaly.com/albums.json -o live-albums.json && cmp -s live-albums.json dist/albums.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # deploy-pages, plus up to 10 minutes waiting for the CDN (see below).
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Check for SITE_DISPATCH_TOKEN
        # `if:` cannot read secrets: this step tells the next one whether the
        # token is set, without handing it to every step of the job.
        id: token
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: echo "set=$([ -n "$SITE_DISPATCH_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Rebuild vtesitaly.com with the new albums
        # The site's event pages read /albums.json at build time. Needs the
        # secret SITE_DISPATCH_TOKEN: a fine-grained token on VtesItaly.Site
        # with Contents read and write. Without it the step is skipped, and so
        # it is when /albums.json did not change (a manual run always sends it).
        #
        # The Pages CDN keeps /albums.json up to 10 minutes and ignores query
        # strings, so the request waits until the live copy is the one just
        # deployed: otherwise vtesitaly.com would rebuild with the old index.
        # The hash also goes in the payload: the Site runner may hit another
        # CDN node, and its fetch-albums waits for the same bytes.
        if: steps.token.outputs.set == 'true' && (needs.ci.outputs.albums-changed == 'true' || github.event_name == 'workflow_dispatch')
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          WANT: ${{ needs.ci.outputs.albums-sha }}
        run: |
          for i in $(seq 1 40); do
            GOT=$(curl -fsS https://foto.vtesitaly.com/albums.json | sha256sum | cut -d' ' -f1 || true)
            [ "$GOT" = "$WANT" ] && { echo "albums.json live after $((i - 1)) waits"; break; }
            [ "$i" = 40 ] && echo "::warning::albums.json still not the new one after 10 minutes: rebuilding anyway."
            sleep 15
          done
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/danilofruttaldo/VtesItaly.Site/dispatches \
            -d "{\"event_type\":\"foto-updated\",\"client_payload\":{\"albums_sha256\":\"$WANT\"}}"
